# Render blueprint for the Waybound backend.
# Connect the repo in the Render dashboard (New > Blueprint); this file must live
# at the repo root. The service code is under rootDir "backend".
# Secrets must be added in the dashboard: JWT_SECRET, ENCRYPTION_KEY,
# FIREBASE_SERVICE_ACCOUNT_JSON, ADMIN_EMAIL, ADMIN_PASSWORD_HASH,
# REVENUECAT_SECRET_API_KEY, EXCHANGERATE_API_KEY, GOOGLE_API_KEY,
# GOOGLE_MAPS_API_KEY.
services:
  - type: web
    name: waybound-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: verba-ai-98eaf
